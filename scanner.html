<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camera Scanner | SkillVerse BD</title>
<script src="theme.js"></script><link rel="stylesheet" href="app.css">
<style>
body{overflow:hidden}
#cam{position:fixed;inset:0;background:#000;z-index:10}
#v{width:100%;height:100%;object-fit:cover}
.ctop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;color:#fff;background:linear-gradient(#0009,transparent);font-weight:700}
.ctop button{color:#fff;font-size:15px;font-weight:600;min-width:44px}
.frame{position:absolute;inset:14% 7% 24%;border:2px solid #ffffffb3;border-radius:18px;pointer-events:none;box-shadow:0 0 0 999px #0000004d}
.hint{position:absolute;left:0;right:0;top:calc(14% - 34px);text-align:center;color:#fff;font-size:12px}
.cbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-around;padding:20px 16px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000a)}
.side{width:52px;height:52px;border-radius:50%;background:#ffffff2e;color:#fff;display:grid;place-items:center;font-size:20px;cursor:pointer}
.shutter{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:var(--primary);box-shadow:0 0 0 4px #ffffff33}
.shutter:active{transform:scale(.92)}
#camerr{position:absolute;left:20px;right:20px;top:40%;color:#fff;text-align:center;font-size:14px}
#res{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.rhead{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 8px}
.rhead button{font-size:22px;width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.tabs{display:flex;gap:8px;padding:0 16px 10px}
.tabs button{flex:1;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.pane{flex:1;overflow:auto;padding:0 16px}
#txt{width:100%;height:100%;min-height:260px;resize:none;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);padding:14px;font:15px/1.6 'Hind Siliguri','Plus Jakarta Sans',sans-serif}
#img{width:100%;border-radius:16px;border:1px solid var(--line);background:#fff;display:block}
.acts{display:flex;gap:8px;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.acts button{flex:1;padding:13px 4px;border-radius:14px;font-weight:700;font-size:13px;background:var(--card);border:1px solid var(--line)}
.acts .pri{background:var(--primary);border-color:var(--primary);color:#fff}
.seg{display:flex;gap:8px;margin-bottom:10px}.seg button{flex:1;padding:9px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px}.seg button.on{background:var(--tint);border-color:var(--primary);color:var(--primary)}
#busy{position:fixed;inset:0;background:#0b1020e6;z-index:40;color:#fff;display:grid;place-content:center;text-align:center;gap:8px}
.spin{width:46px;height:46px;border:4px solid #ffffff44;border-top-color:#fff;border-radius:50%;margin:auto;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
#sheet{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end}
#sheet>div{background:var(--bg);width:100%;max-height:70vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.sv{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.sv span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.sv small{color:var(--muted)}
[hidden]{display:none!important}
</style></head>
<body>
<div id="cam">
 <video id="v" autoplay playsinline muted></video>
 <div class="ctop"><button id="close" aria-label="Close">✕</button><span>Scan</span><button id="savedBtn">Saved</button></div>
 <div class="hint">Place the page inside the frame</div><div class="frame"></div>
 <p id="camerr" hidden>Camera could not start. Allow camera permission, or upload a photo with the button below.</p>
 <div class="cbar">
  <label class="side" aria-label="Upload image">🖼<input type="file" id="file" accept="image/*" hidden></label>
  <button class="shutter" id="shot" aria-label="Capture"></button>
  <span class="side" style="visibility:hidden"></span>
 </div>
</div>
<section id="res" hidden>
 <div class="rhead"><button id="back" aria-label="Retake">←</button><strong>Scan result</strong><button id="home" aria-label="Home">⌂</button></div>
 <div class="tabs"><button id="tT" class="on">Text</button><button id="tD">Document</button></div>
 <div class="pane" id="pT"><textarea id="txt" spellcheck="false" placeholder="Recognized text appears here"></textarea></div>
 <div class="pane" id="pD" hidden><div class="seg"><button id="mBW" class="on">Black &amp; White</button><button id="mCo">Color</button></div><img id="img" alt="Scanned document"></div>
 <div class="acts" id="aT"><button id="copy">Copy</button><button id="dl">Download</button><button class="pri" id="save">Save</button></div>
 <div class="acts" id="aD" hidden><button id="dlImg">Download</button><button class="pri" id="gal">Save to gallery</button></div>
</section>
<div id="busy" hidden><div class="spin"></div><b id="bstat">Analyzing…</b><small id="pct"></small></div>
<div id="sheet" hidden><div><h3 style="margin:0">Saved scans</h3><div id="list"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id);let stream,cameraPromise=null,ocrWorkerPromise=null,bwC,coC,mode='bw',KEY='skillverse_scans_v1';
async function start(){
 $('camerr').hidden=true;
 if(stream&&stream.getVideoTracks().some(t=>t.readyState==='live')){$('v').srcObject=stream;return}
 if(cameraPromise)return cameraPromise;
 cameraPromise=(async()=>{try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('Camera is not supported');
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false});
  $('v').srcObject=stream;await $('v').play().catch(()=>{});
 }catch(e){$('camerr').textContent='Camera could not start. Please allow camera access once in your browser settings, or upload a photo.';$('camerr').hidden=false}finally{cameraPromise=null}})();
 return cameraPromise
}
function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('v').srcObject=null;if(ocrWorkerPromise){ocrWorkerPromise.then(w=>w.terminate()).catch(()=>{});ocrWorkerPromise=null}}
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function fromFile(f){return new Promise((resolve,reject)=>{const i=new Image(),url=URL.createObjectURL(f);i.onload=()=>{const c=cv(i.naturalWidth,i.naturalHeight);c.getContext('2d').drawImage(i,0,0);URL.revokeObjectURL(url);resolve(c)};i.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Image could not be opened'))};i.src=url})}
function prepare(src){
 const scale=Math.min(1,2200/Math.max(src.width,src.height)),w=Math.max(1,Math.round(src.width*scale)),h=Math.max(1,Math.round(src.height*scale));
 const color=cv(w,h);color.getContext('2d').drawImage(src,0,0,w,h);
 const bw=cv(w,h),ctx=bw.getContext('2d');ctx.filter='grayscale(1) contrast(1.18)';ctx.drawImage(color,0,0);ctx.filter='none';
 return {color,bw}
}
async function getOCRWorker(){
 if(!ocrWorkerPromise){
  ocrWorkerPromise=Tesseract.createWorker('eng+ben',1,{logger:m=>{
   if(m.status==='loading language traineddata'||m.status==='initializing tesseract')$('bstat').textContent='Preparing OCR engine…';
   else if(m.status==='recognizing text')$('bstat').textContent='Reading Bangla & English…';
   if(m.progress!=null)$('pct').textContent=Math.round(m.progress*100)+'%';
  }}).catch(e=>{ocrWorkerPromise=null;throw e});
 }
 return ocrWorkerPromise
}
async function run(src){
 $('cam').hidden=true;$('busy').hidden=false;$('bstat').textContent='Preparing image…';$('pct').textContent='';await new Promise(r=>setTimeout(r,20));
 let text='';
 try{
  const prepared=prepare(src);coC=prepared.color;bwC=prepared.bw;setMode('bw');
  const worker=await getOCRWorker();$('bstat').textContent='Reading Bangla & English…';
  const result=await worker.recognize(coC);text=(result.data.text||'').trim();
 }catch(e){
  console.error('Scanner OCR error:',e);
  text='';
 }
 $('txt').value=text;$('txt').placeholder=text?'':'No text detected. Try a clearer, well-lit photo, or type/edit the text here.';
 $('busy').hidden=true;$('res').hidden=false;tab('T')
}
function setMode(m){mode=m;$('img').src=(m==='bw'?bwC:coC).toDataURL('image/png');$('mBW').classList.toggle('on',m==='bw');$('mCo').classList.toggle('on',m==='co')}
function tab(t){$('tT').classList.toggle('on',t==='T');$('tD').classList.toggle('on',t==='D');$('pT').hidden=t!=='T';$('aT').hidden=t!=='T';$('pD').hidden=t!=='D';$('aD').hidden=t!=='D'}
function dlBlob(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
const png=()=>new Promise(r=>(mode==='bw'?bwC:coC).toBlob(r,'image/png'));
const store=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}};
function renderList(){const l=store();$('list').innerHTML=l.length?'':'<p style="color:var(--muted)">Nothing saved yet.</p>';l.forEach((s,i)=>{const d=document.createElement('div');d.className='sv';d.innerHTML='<span></span><small>'+new Date(s.t).toLocaleDateString()+'</small><button>🗑</button>';d.firstChild.textContent=s.text.slice(0,60)||'(empty)';d.firstChild.onclick=()=>{$('txt').value=s.text;$('sheet').hidden=true;$('cam').hidden=true;$('res').hidden=false;tab('T')};d.lastChild.onclick=()=>{const a=store();a.splice(i,1);localStorage.setItem(KEY,JSON.stringify(a));renderList()};$('list').appendChild(d)})}
$('shot').onclick=()=>{const v=$('v');if(!v.videoWidth)return;const c=cv(v.videoWidth,v.videoHeight);c.getContext('2d').drawImage(v,0,0);run(c)};
$('file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)run(await fromFile(f))};
$('close').onclick=()=>{stop();location.href='index.html'};$('home').onclick=()=>location.href='index.html';
$('back').onclick=()=>{$('res').hidden=true;$('cam').hidden=false;start()};
$('tT').onclick=()=>tab('T');$('tD').onclick=()=>tab('D');$('mBW').onclick=()=>setMode('bw');$('mCo').onclick=()=>setMode('co');
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('txt').value)}catch{$('txt').select();document.execCommand('copy')}$('copy').textContent='Copied ✓';setTimeout(()=>$('copy').textContent='Copy',1400)};
$('dl').onclick=()=>dlBlob(new Blob(['\ufeff'+$('txt').value],{type:'text/plain;charset=utf-8'}),'scan-'+Date.now()+'.txt');
$('save').onclick=()=>{const a=store();a.unshift({t:Date.now(),text:$('txt').value});localStorage.setItem(KEY,JSON.stringify(a.slice(0,50)));$('save').textContent='Saved ✓';setTimeout(()=>$('save').textContent='Save',1400)};
$('dlImg').onclick=async()=>dlBlob(await png(),'scan-'+Date.now()+'.png');
$('gal').onclick=async()=>{const b=await png(),f=new File([b],'scan-'+Date.now()+'.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}dlBlob(b,f.name)};
$('savedBtn').onclick=()=>{renderList();$('sheet').hidden=false};$('sheet').onclick=e=>{if(e.target.id==='sheet')$('sheet').hidden=true};
start();
</script><script type="module" src="tracker.js"></script></body></html>
