<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>Sign In | SkillVerse BD</title>
<style>
:root{--bg:#0b1020;--panel:#121a2d;--line:#26334d;--text:#f2f5ff;--muted:#97a6c2}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 85% -10%,#2a2057 0,transparent 38%),var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px 20px calc(108px + env(safe-area-inset-bottom))}.auth{width:100%;max-width:440px}.top{display:flex;align-items:center;gap:12px;margin-bottom:23px}.back{width:39px;height:39px;border:1px solid var(--line);background:var(--panel);border-radius:13px;font-size:20px;color:inherit}.brand{font-weight:800;font-size:17px}.brand span{color:#a78bfa}.subtitle{color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase}.panel{border:1px solid var(--line);background:linear-gradient(145deg,#151f34,#11192a);border-radius:21px;padding:20px}.heading{font-size:25px;letter-spacing:-.7px;margin:0 0 5px;font-weight:800}.lead{color:var(--muted);font-size:13px;margin:0 0 18px}label{display:block;font-size:12px;font-weight:700;margin:12px 0 7px}input{width:100%;height:45px;color:var(--text);background:#0d1526;border:1px solid #2b3954;border-radius:12px;padding:11px 12px;font:inherit}input:focus{outline:1px solid #9a70ff;border-color:#9a70ff}.primary,.secondary{padding:12px 15px;border-radius:13px;font-weight:800;font-size:13px;margin-top:14px}.primary{width:100%;background:linear-gradient(100deg,#9a70ff,#628eff);color:white;border:0}.secondary{background:#222d45;border:1px solid #34435e;color:inherit;width:100%}.switch{display:flex;justify-content:center;gap:5px;margin-top:16px;font-size:12px;color:var(--muted)}.switch button,.forgot{background:none;border:0;color:#b7a0ff;font:inherit;font-weight:700;cursor:pointer}.forgot{display:block;margin:10px auto 0;font-size:12px}.message{font-size:12px;margin-top:13px;min-height:18px;color:#c5b8ff}.notice{font-size:11px;color:var(--muted);margin-top:15px;line-height:1.5}.hidden{display:none}

/* Global fixed bottom navigation */
.bottom{position:fixed!important;left:0!important;right:0!important;bottom:0!important;z-index:9999!important;display:flex!important;justify-content:center!important;background:rgba(12,19,34,.96)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid #27334b!important;padding:9px 8px calc(9px + env(safe-area-inset-bottom))!important}
.bottom .nav{width:min(540px,100%)!important;display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:2px!important}
.bottom .nav button{min-width:0!important;background:none!important;border:0!important;color:#8190ab!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:4px!important;padding:5px 2px!important;font:600 10px/1.2 Inter,system-ui,sans-serif!important;white-space:nowrap!important}
.bottom .nav button .navicon{font-size:19px!important;line-height:1.2!important}
.bottom .nav button.active{color:#b7a0ff!important}
.bottom .nav button.active .navicon{filter:drop-shadow(0 0 7px #a78bfa66)}
.app{padding-bottom:calc(108px + env(safe-area-inset-bottom))!important}
@media print{.bottom{display:none!important}}
</style><script src="theme.js"></script><link rel="stylesheet" href="theme.css"></head><body><main class="auth">
<header class="top"><button class="back" onclick="location.href='profile.html'" aria-label="Back to Profile">‹</button><div><div class="brand">SkillVerse <span>BD</span></div><div class="subtitle">Student account</div></div></header>
<section class="panel"><h1 class="heading" id="title">Welcome back 👋</h1><p class="lead" id="lead">Sign in to your SkillVerse BD account.</p>
<form id="form"><label for="email">Email Address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters"><label id="confirmLabel" class="hidden" for="confirm">Confirm Password</label><input id="confirm" class="hidden" type="password" autocomplete="new-password" minlength="6" placeholder="Enter password again"><button class="primary" id="submit" type="submit">Sign In</button></form>
<button class="forgot" id="forgot">Forgot password?</button><div class="switch"><span id="switchText">New to SkillVerse?</span><button id="switch">Create account</button></div><div class="message" id="message" role="status"></div><p class="notice">Firebase authentication will work after the project’s web configuration is added. Use a strong password and never share it.</p></section>
</main><nav class="bottom" aria-label="Main navigation"><div class="nav"><button type="button" data-page="Home" class="" aria-label="Home" onclick="location.href='index.html'"><svg class="navicon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>হোম</button><button type="button" data-page="AI Study" class="" aria-label="AI Study" onclick="location.href='ai-study.html'"><svg class="navicon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>AI পড়া</button><button type="button" data-page="Quiz" class="" aria-label="Quiz" onclick="location.href='quiz.html'"><svg class="navicon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 9h6M9 13h4"/></svg>কুইজ</button><button type="button" data-page="Tools" class="" aria-label="Tools" onclick="location.href='tools.html'"><svg class="navicon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>টুলস</button><button type="button" data-page="Profile" class="" aria-label="Profile" onclick="location.href='profile.html'"><svg class="navicon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>প্রোফাইল</button></div></nav><script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, updateProfile } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { firebaseConfig } from './firebase-config.js';
const $=id=>document.getElementById(id);let signup=false;
const configReady=Object.values(firebaseConfig).every(v=>typeof v==='string'&&v.trim()&&!v.includes('PASTE_'));
let auth=null;if(configReady){try{auth=getAuth(initializeApp(firebaseConfig))}catch(e){$('message').textContent='Firebase configuration error. Please check firebase-config.js.'}}
function mode(){ $('title').textContent=signup?'Create your account ✨':'Welcome back 👋';$('lead').textContent=signup?'Join SkillVerse BD and personalize your learning.':'Sign in to your SkillVerse BD account.';$('submit').textContent=signup?'Create Account':'Sign In';$('confirm').classList.toggle('hidden',!signup);$('confirmLabel').classList.toggle('hidden',!signup);$('confirm').required=signup;$('password').autocomplete=signup?'new-password':'current-password';$('forgot').classList.toggle('hidden',signup);$('switchText').textContent=signup?'Already have an account?':'New to SkillVerse?';$('switch').textContent=signup?'Sign In':'Create account';$('message').textContent=configReady?'': 'Firebase setup is pending. Add your Firebase Web App config to firebase-config.js to enable account actions.'}
$('switch').onclick=()=>{signup=!signup;$('message').textContent='';mode()};
$('form').onsubmit=async e=>{e.preventDefault();if(!auth){$('message').textContent='Firebase setup is pending. Configure firebase-config.js first.';return}const email=$('email').value.trim(),password=$('password').value;if(signup&&password!==$('confirm').value){$('message').textContent='Passwords do not match.';return}$('submit').disabled=true;$('message').textContent=signup?'Creating your account…':'Signing you in…';try{if(signup){const credential=await createUserWithEmailAndPassword(auth,email,password);await updateProfile(credential.user,{displayName:email.split('@')[0]});location.href='profile.html'}else{await signInWithEmailAndPassword(auth,email,password);location.href='profile.html'}}catch(err){const errors={'auth/email-already-in-use':'This email already has an account. Sign in instead.','auth/invalid-credential':'Email or password is incorrect.','auth/weak-password':'Choose a stronger password (at least 6 characters).','auth/invalid-email':'Please enter a valid email address.','auth/too-many-requests':'Too many attempts. Please wait and try again.','auth/network-request-failed':'Network error. Check your internet connection.'};$('message').textContent=errors[err.code]||err.message||'Authentication failed.'}finally{$('submit').disabled=false}};
$('forgot').onclick=async()=>{if(!auth){$('message').textContent='Firebase setup is pending.';return}const email=$('email').value.trim();if(!email){$('message').textContent='Enter your email address first.';return}try{await sendPasswordResetEmail(auth,email);$('message').textContent='Password reset email sent. Check your inbox.'}catch(err){$('message').textContent=err.code==='auth/invalid-email'?'Please enter a valid email.':err.message}};
mode();
</script></body></html>
