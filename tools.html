<!doctype html>
<html lang="en"><head><meta charset="UTF-8">

<script src="theme.js"></script><link rel="stylesheet" href="app.css">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Montserrat:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
.seg2{display:flex;gap:8px;margin:14px 0}.seg2 button{flex:1;padding:11px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;color:var(--muted)}.seg2 button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}.box h3{margin:0 0 6px;font-size:15px}
.box label{display:block;margin:10px 2px 5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.box input,.box textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}textarea{min-height:76px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pic{display:flex;align-items:center;gap:14px}.pic .av2{width:84px;height:84px;border-radius:50%;background:var(--tint);overflow:hidden;display:grid;place-items:center;font-size:30px;flex:none}.pic img{width:100%;height:100%}
.btn{padding:12px 14px;border-radius:14px;font-weight:700;background:var(--card);border:1px solid var(--line)}.btn.p{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.w{width:100%;min-height:52px}
.item{border:1px dashed var(--line);border-radius:14px;padding:10px;margin-top:10px}.item .rm{float:right;color:#e0446c;font-weight:700}
#tpls{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px}.tp{flex:none;border:2px solid var(--line);border-radius:10px;background:#fff;padding:0;overflow:hidden}.tp.on{border-color:var(--primary)}
.th{width:100px;height:141px;overflow:hidden;position:relative}.th>div{transform:scale(.126);transform-origin:0 0;width:794px}
#stage{margin:auto;position:relative;box-shadow:0 10px 30px rgba(30,40,100,.2);background:#fff}#wrap{transform-origin:0 0;width:794px;position:absolute;left:0;top:0}
.acts2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
#ps{display:none}
@page{size:A4;margin:0}@media print{body{background:#fff}.app,.sv-nav{display:none!important}#ps{display:block!important}}
.cv{width:794px;height:1123px;position:relative;overflow:hidden;background:#fff;box-sizing:border-box;text-align:left}.cv *{box-sizing:border-box}.cv h1,.cv h2,.cv h3,.cv p,.cv ul{margin:0;padding:0}.cv ul{list-style:none}.cv .ph{overflow:hidden}.cv .ph img{width:100%;height:100%;display:block}.cv .np{width:100%;height:100%;display:grid;place-items:center;background:#cbd2dc;color:#fff;font-size:60px}
.cv svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.cv .c{display:flex;gap:8px;align-items:center;margin-bottom:7px;word-break:break-all}
.cv .x{margin-bottom:12px}.cv .xh b,.cv .xh i,.cv .xh em{display:block;font-style:normal}.cv .x li{position:relative;padding-left:12px}.cv .x li:before{content:"•";position:absolute;left:0}.cv section{margin-bottom:18px}
/* T1 */.t1{font:13px/1.5 'Open Sans',sans-serif;color:#222}.t1 .bar{position:absolute;left:0;top:0;width:48px;height:205px;background:#fbe08a}.t1 .hd{position:absolute;left:92px;right:40px;top:62px;display:flex;align-items:center}.t1 .hd .ct{width:250px;font-size:12px}.t1 h1{font-size:40px;font-weight:800;line-height:1.1}.t1 .pho{position:absolute;left:72px;top:205px;width:190px;height:190px}.t1 .sm{position:absolute;left:262px;right:0;top:205px;height:190px;background:#eee;padding:16px 40px 0 28px}.t1 h3{font-size:17px;font-weight:700;border-bottom:4px solid #fbe08a;padding-bottom:3px;margin-bottom:9px}.t1 .sm h3{margin-bottom:8px;font-size:18px}.t1 .sm p{font-size:12px;line-height:1.5}.t1 .l{position:absolute;left:72px;width:250px;top:430px}.t1 .r{position:absolute;left:350px;right:44px;top:430px}.t1 .xh b{font-weight:600}.t1 .xh em{color:#555}.t1 .l li{padding-left:14px;position:relative}.t1 .l li:before{content:"•";position:absolute;left:0}
/* T2 */.t2{font:14px/1.6 Montserrat,sans-serif;color:#2a2a2a;padding:62px 60px}.t2 h1{text-align:center;font-size:40px;font-weight:800;letter-spacing:2px;text-transform:uppercase;line-height:1.15}.t2 .tt{text-align:center;font-size:21px;font-weight:400;margin-bottom:16px}.t2 .ctr{display:flex;justify-content:space-between;border-bottom:2px solid #333;padding-bottom:10px;font-size:13px;color:#555;margin-bottom:6px}.t2 .ctr .c{margin:0}.t2 section{border-bottom:2px solid #333;padding:14px 0 6px;margin:0}.t2 section:last-of-type{border:0}.t2 h3{font-size:18px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:6px}.t2 .xh{display:flex;flex-wrap:wrap;color:#666}.t2 .xh i,.t2 .xh em{display:block;font-size:13px}.t2 .xh i{order:0}.t2 .xh em{order:1}.t2 .xh em:before{content:'|';margin:0 8px}.t2 .xh b{order:2;width:100%;color:#222;font-size:14px}.t2 ul.k{columns:3}.t2 .k li{padding-left:16px}.t2 .foot{position:absolute;left:0;right:0;bottom:0;height:32px;background:#666}
/* T3 */.t3{font:13px/1.55 Roboto,sans-serif;background:#ececec;color:#555}.t3 .top3{position:absolute;left:0;right:0;top:0;height:170px;background:#4e8aab;padding:42px 36px;color:#fff}.t3 h1{font-size:42px;font-weight:500;text-transform:uppercase;line-height:1.1}.t3 .tt{font-size:22px;font-weight:300;text-transform:uppercase;letter-spacing:1px;opacity:.9}.t3 .pho{position:absolute;right:30px;top:12px;width:178px;height:178px;border-radius:50%;border:6px solid #fff;z-index:3}.t3 .pho .ph{border-radius:50%;width:100%;height:100%}.t3 .sb{position:absolute;left:0;top:170px;bottom:0;width:282px;background:#2b3748;color:#fff;padding:30px 24px}.t3 .sb h3{font-size:17px;font-weight:500;text-transform:uppercase;border-top:1px solid #8995a6;padding-top:16px;margin-bottom:10px}.t3 .sb section{margin-bottom:20px}.t3 .sb section:first-child h3{display:none}.t3 .sb .c{font-size:14px;margin-bottom:12px;gap:12px}.t3 .mn{position:absolute;left:312px;right:34px;top:200px}.t3 .mn h3{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:400;text-transform:uppercase;color:#222;margin-bottom:10px}.t3 .mn h3:after{content:"";flex:1;border-top:2px solid #555}.t3 .xh b{color:#222;font-weight:700}.t3 .xh{position:relative;padding-right:110px}.t3 .xh em{color:#222;position:absolute;right:0;top:0}.t3 .xh i{color:#777}.t3 .sb li{margin-bottom:4px}
/* T4 */.t4{font:12.5px/1.5 Montserrat,sans-serif;color:#222}.t4 .blk{position:absolute;left:0;top:0;width:130px;height:130px;background:#26364f}.t4 .pho{position:absolute;left:44px;top:40px;width:200px;height:200px;border-radius:50%;border:6px solid #fff;box-shadow:0 0 0 4px #26364f;background:#fff;z-index:2}.t4 .pho .ph{width:100%;height:100%;border-radius:50%}.t4 .nm{position:absolute;left:272px;top:40px;width:470px}.t4 h1{font-size:50px;font-weight:800;color:#26364f;text-transform:uppercase;line-height:1}.t4 .tt{font-size:17px;margin-top:10px;padding-left:80px}.t4 .lc{position:absolute;left:34px;width:290px;top:262px}.t4 .rc{position:absolute;left:352px;right:40px;top:232px}.t4 h3{background:#26364f;color:#fff;text-align:center;text-transform:uppercase;font-size:13px;font-weight:500;padding:7px;margin-bottom:12px}.t4 .ab{text-align:center;margin-bottom:16px}.t4 .ab h3{background:none;color:#222;font-size:18px;text-transform:none;padding:0 0 6px;font-weight:500}.t4 .c svg{background:#26364f;color:#fff;width:30px;height:30px;padding:7px;border-radius:50%}.t4 .lc li{padding-left:14px;position:relative;margin:0 0 5px 20px}.t4 .lc li:before{content:"•";position:absolute;left:0}.t4 .xh b{font-weight:800}.t4 .xh i{font-weight:600}.t4 .xh em{font-weight:700}.t4 .dc{position:absolute;width:170px;height:170px;border-radius:50%;background:repeating-linear-gradient(135deg,#9aa3b2 0 1px,transparent 1px 5px)}
/* T5 */.t5{font:14px/1.5 Ubuntu,sans-serif;background:#f3f5fa;color:#111}.t5 .bl{position:absolute;left:34px;top:0;width:238px;height:170px;background:#8aa3d0}.t5 .pho{position:absolute;left:12px;top:12px;width:262px;height:262px;border-radius:50%;border:7px solid #fff;z-index:2}.t5 .pho .ph{width:100%;height:100%;border-radius:50%}.t5 .bn{position:absolute;left:34px;top:150px;width:238px;height:340px;background:#0a0a0a;clip-path:polygon(0 0,100% 0,100% 88%,50% 100%,0 88%);color:#fff;text-align:center;padding-top:170px}.t5 h1{font-size:38px;font-weight:400;line-height:1.15}.t5 .tt{font-size:18px;margin-top:8px}.t5 .rc{position:absolute;left:318px;right:36px;top:40px}.t5 h3{font-size:30px;font-weight:700;text-transform:uppercase;color:#8aa3d0;margin-bottom:8px}.t5 .rc section{margin-bottom:22px}.t5 .rc p,.t5 .rc .c{font-size:14px}.t5 .ex{position:absolute;left:34px;right:36px;top:520px}.t5 .ex .x{display:grid;grid-template-columns:130px 1fr;position:relative;margin:0 0 20px 0}.t5 .ex:before{content:"";position:absolute;left:-1px;top:40px;bottom:30px;border-left:3px solid #8aa3d0}.t5 .xh em{order:-1}.t5 .xh{display:contents}.t5 .xh em{grid-column:1;grid-row:1;font-weight:500}.t5 .xh b{grid-column:1;grid-row:2;color:#8aa3d0;font-weight:700}.t5 .xh i{grid-column:2;grid-row:1;font-style:normal;font-weight:500}.t5 .x ul,.t5 .x p{grid-column:2;grid-row:2;font-size:13px}.t5 .fb{position:absolute;left:0;right:0;bottom:0;height:18px;background:#8aa3d0}.t5 .fb:after{content:"";position:absolute;right:0;top:0;bottom:0;width:60px;background:#111}
/* T6 */.t6{font:13px/1.55 Roboto,sans-serif;color:#222}.t6 .pk{position:absolute;left:110px;top:0;width:126px;height:190px;background:#fde1e3}.t6 .hd6{position:absolute;left:0;width:310px;top:38px;text-align:center}.t6 h1{font-size:24px;font-weight:400;letter-spacing:1px;text-transform:uppercase}.t6 .tt{font-size:18px;color:#555;margin-top:2px}.t6 .pho{position:absolute;left:66px;top:118px;width:180px;height:180px;border-radius:50%;overflow:hidden}.t6 .lc{position:absolute;left:20px;width:290px;top:330px}.t6 .rc{position:absolute;left:340px;right:30px;top:30px}.t6 h3{background:#f4adad;font-size:17px;font-weight:500;text-transform:uppercase;padding:8px 16px;margin-bottom:12px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%)}.t6 .rc h3{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 0)}.t6 .lc section{margin-bottom:20px}.t6 .lc p,.t6 .lc .c{padding-left:12px}.t6 .rc .x{position:relative;padding-left:22px;border-left:2px solid #f4adad;margin-left:6px}.t6 .rc .x:before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:#f4adad}.t6 .xh em{color:#555;order:-1}.t6 .xh{display:flex;flex-direction:column}.t6 .xh em{order:-1}.t6 .xh b{font-weight:700}.t6 .xh i{font-weight:400}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><div class="logo">CV</div><div class="brand-name">SkillVerse <span>BD</span></div></div></header>
<h1 class="greeting">CV <span>Maker</span></h1><p class="sub">Fill in your information, pick a template, get a ready A4 CV.</p>
<div class="seg2"><button id="tabF" class="on">Information</button><button id="tabP">Preview</button></div>
<section id="vF">
<div class="box"><div class="pic"><div class="av2" id="av">👤</div><div><label class="btn" style="display:inline-block;margin:0">Upload photo<input type="file" id="pf" accept="image/*" hidden></label><br><button class="btn" id="pr" style="margin-top:8px;padding:8px 12px;font-size:12px">Remove</button></div></div></div>
<div class="box"><h3>Personal details</h3>
<label>Full name</label><input data-f="name"><label>Job title</label><input data-f="title">
<div class="g2"><div><label>Phone</label><input data-f="phone"></div><div><label>Email</label><input data-f="email"></div><div><label>Date of birth</label><input data-f="dob"></div><div><label>Gender</label><input data-f="gender"></div></div>
<label>Address</label><input data-f="address"><label>Website / LinkedIn</label><input data-f="website"></div>
<div class="box"><h3>Summary / Objective</h3><textarea data-f="summary"></textarea></div>
<div class="box"><h3>Work experience</h3><div id="lx"></div><button class="btn" id="ax" style="margin-top:10px">+ Add experience</button></div>
<div class="box"><h3>Education</h3><div id="le"></div><button class="btn" id="ae" style="margin-top:10px">+ Add education</button></div>
<div class="box"><h3>More (one item per line)</h3><label>Skills</label><textarea data-f="skills"></textarea><label>Languages</label><textarea data-f="languages"></textarea><label>Honors &amp; awards</label><textarea data-f="honors"></textarea><label>Interests</label><textarea data-f="interests"></textarea><label>References</label><textarea data-f="references"></textarea></div>
<button class="btn p w" id="go">See my CV →</button></section>
<section id="vP" hidden><div id="tpls"></div><div id="stage"><div id="wrap"></div></div>
<div class="acts2"><button class="btn" id="sv">Save</button><button class="btn p" id="pdf">Download PDF</button><button class="btn" id="prt">Print</button></div><p class="sub" id="msg" style="text-align:center;margin-top:10px"></p></section>
</main><div id="ps"></div>
<script src="nav.js" data-active="home"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id),KEY='skillverse_cv_v1';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),br=s=>esc(s).replace(/\n/g,'<br>'),ls=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean),li=s=>ls(s).map(x=>'<li>'+esc(x)+'</li>').join(''),dt=(a,b)=>[a,b].filter(Boolean).join(' - ');
const IC={phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/>',mail:'<path d="M3 5h18v14H3zM3 6l9 7 9-7"/>',pin:'<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',cal:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'};
const ic=n=>'<svg viewBox="0 0 24 24">'+IC[n]+'</svg>';
const SAMPLE={name:'Melanie Robinson',title:'Customer Service Representative',phone:'+1 970 333 3833',email:'melanie@mail.com',address:'Chicago, USA',website:'linkedin.com/in/melanie',dob:'May 19, 1992',gender:'Female',summary:'Qualified customer service representative with over 4 years in fast-paced call center environments. Skilled at building loyal relationships, solving problems and increasing sales.',skills:'International sales support\nStrategic sales knowledge\nCommunication skills\nStock records management',languages:'English\nBangla',honors:'2013: Scholarship for excellent results',interests:'Soccer, music',references:'Steve Halloway - Business Consultant\nshalloway@sx.com',photo:'',
exp:[{role:'Customer Service Representative',company:'BATS Global Markets Inc.',from:'04/2017',to:'09/2018',desc:'Followed up on purchases and informed customers on promotions\nAnswered product questions with up-to-date knowledge'},{role:'Customer Service Representative',company:'Foodspotting Inc.',from:'04/2015',to:'09/2016',desc:'Assisted customers with orders and inquiries\nAnswered an average of 100 calls per day'}],
edu:[{school:'Oregon State University',degree:'Bachelor of Arts: Marketing',from:'2010',to:'2014',extra:''}]};
let D=JSON.parse(JSON.stringify(SAMPLE)),T=0;D=Object.assign({},{name:'',title:'',phone:'',email:'',address:'',website:'',dob:'',gender:'',summary:'',skills:'',languages:'',honors:'',interests:'',references:'',photo:'',exp:[{role:'',company:'',from:'',to:'',desc:''}],edu:[{school:'',degree:'',from:'',to:'',extra:''}]});
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){Object.assign(D,s.d);T=s.t||0}}catch(e){}
const P=d=>d.photo?'<img src="'+d.photo+'">':'<div class="np">'+esc((d.name||'?').charAt(0).toUpperCase())+'</div>';
const cts=d=>[['phone',d.phone],['mail',d.email],['web',d.website],['pin',d.address]].filter(x=>x[1]).map(x=>'<div class="c">'+ic(x[0])+'<span>'+esc(x[1])+'</span></div>').join('');
const cts2=d=>[['user',d.gender],['cal',d.dob]].filter(x=>x[1]).map(x=>'<div class="c">'+ic(x[0])+'<span>'+esc(x[1])+'</span></div>').join('')+cts(d);
const xp=d=>d.exp.filter(e=>e.role||e.company).map(e=>'<div class="x"><div class="xh"><b>'+esc(e.role)+'</b><i>'+esc(e.company)+'</i><em>'+esc(dt(e.from,e.to))+'</em></div><ul>'+li(e.desc)+'</ul></div>').join('');
const ed=d=>d.edu.filter(e=>e.school||e.degree).map(e=>'<div class="x"><div class="xh"><b>'+esc(e.school)+'</b><i>'+esc(e.degree)+'</i><em>'+esc(dt(e.from,e.to))+'</em></div>'+(e.extra?'<p>'+esc(e.extra)+'</p>':'')+'</div>').join('');
const S=(t,h)=>h?'<section><h3>'+t+'</h3>'+h+'</section>':'';
const UL=(s,c)=>ls(s).length?'<ul'+(c?' class="'+c+'"':'')+'>'+li(s)+'</ul>':'';
const TPL=[
d=>'<div class="cv t1"><i class="bar"></i><div class="hd"><div class="ct">'+cts(d)+'</div><h1>'+esc(d.name)+'</h1></div><div class="pho ph">'+P(d)+'</div><div class="sm"><h3>Summary</h3><p>'+br(d.summary)+'</p></div><div class="l">'+S('Skills',UL(d.skills))+S('Education',ed(d))+S('Languages',UL(d.languages))+S('Reference',br(d.references))+'</div><div class="r">'+S('Work history',xp(d))+S('Honors &amp; awards',br(d.honors))+'</div></div>',
d=>'<div class="cv t2"><h1>'+esc(d.name)+'</h1><p class="tt">'+esc(d.title)+'</p><div class="ctr">'+cts(d)+'</div>'+S('About me',br(d.summary))+S('Education',ed(d))+S('Work experience',xp(d))+S('Skills',UL(d.skills,'k'))+S('Languages',UL(d.languages,'k'))+'<div class="foot"></div></div>',
d=>'<div class="cv t3"><div class="top3"><h1>'+esc(d.name)+'</h1><p class="tt">'+esc(d.title)+'</p></div><div class="pho"><div class="ph">'+P(d)+'</div></div><div class="sb"><section><h3>Info</h3>'+cts2(d)+'</section>'+S('Skills',UL(d.skills))+S('Languages',UL(d.languages))+S('Honors &amp; awards',br(d.honors))+S('Interests',br(d.interests))+'</div><div class="mn">'+S('Objective',br(d.summary))+S('Education',ed(d))+S('Work experience',xp(d))+S('References',br(d.references))+'</div></div>',
d=>'<div class="cv t4"><i class="blk"></i><i class="dc" style="right:-60px;top:-60px"></i><i class="dc" style="right:-50px;bottom:-50px"></i><div class="pho"><div class="ph">'+P(d)+'</div></div><div class="nm"><h1>'+esc(d.name)+'</h1><p class="tt">'+esc(d.title)+'</p></div><div class="lc">'+(d.summary?'<div class="ab"><h3>About Me</h3><p>'+br(d.summary)+'</p></div>':'')+'<div style="margin-bottom:18px">'+cts(d)+'</div>'+S('Language',UL(d.languages))+S('Expertise',UL(d.skills))+'</div><div class="rc">'+S('Experience',xp(d))+S('Education',ed(d))+S('Honors',br(d.honors))+'</div></div>',
d=>'<div class="cv t5"><i class="bl"></i><div class="pho"><div class="ph">'+P(d)+'</div></div><div class="bn"><h1>'+esc(d.name)+'</h1><p class="tt">'+esc(d.title)+'</p></div><div class="rc">'+S('Profile',br(d.summary))+S('Contact',cts(d))+(ls(d.skills).length?S('Skills',esc(ls(d.skills).join(' · '))):'')+'</div><div class="ex">'+S('Experience',xp(d))+S('Education',ed(d))+'</div><div class="fb"></div></div>',
d=>'<div class="cv t6"><i class="pk"></i><div class="hd6"><h1>'+esc(d.name)+'</h1><p class="tt">'+esc(d.title)+'</p></div><div class="pho ph">'+P(d)+'</div><div class="lc">'+S('Contacts',cts2(d))+S('Objective','<p>'+br(d.summary)+'</p>')+S('Skills',UL(d.skills)+UL(d.languages))+S('Interests','<p>'+br(d.interests)+'</p>')+'</div><div class="rc">'+S('Education',ed(d))+S('Work experience',xp(d))+S('Honors &amp; awards','<p>'+br(d.honors)+'</p>')+S('References','<p>'+br(d.references)+'</p>')+'</div></div>'];
const view=()=>D.name.trim()?D:Object.assign({},SAMPLE,{photo:D.photo});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({d:D,t:T}))}catch(e){}};
function lists(){[['lx','exp',[['role','Job title'],['company','Company'],['from','From'],['to','To']],'desc','Description (one point per line)'],['le','edu',[['school','School / University'],['degree','Degree / Major'],['from','From'],['to','To']],'extra','Extra (e.g. GPA)']].forEach(([id,k,fs,tf,tl])=>{$(id).innerHTML=D[k].map((it,i)=>'<div class="item"><button class="rm" data-k="'+k+'" data-rm="'+i+'">Remove</button><div class="g2" style="clear:both">'+fs.map(f=>'<div><label>'+f[1]+'</label><input data-k="'+k+'" data-i="'+i+'" data-g="'+f[0]+'" value="'+esc(it[f[0]])+'"></div>').join('')+'</div><label>'+tl+'</label><textarea data-k="'+k+'" data-i="'+i+'" data-g="'+tf+'" style="min-height:60px">'+esc(it[tf])+'</textarea></div>').join('')})}
function form(){document.querySelectorAll('[data-f]').forEach(e=>e.value=D[e.dataset.f]||'');lists();photoUI()}
function photoUI(){$('av').innerHTML=D.photo?'<img src="'+D.photo+'">':'👤'}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f)D[t.dataset.f]=t.value;else if(t.dataset.g)D[t.dataset.k][t.dataset.i][t.dataset.g]=t.value;else return;save()});
document.addEventListener('click',e=>{const r=e.target.dataset.rm;if(r!==undefined){const k=e.target.dataset.k;D[k].splice(r,1);if(!D[k].length)D[k].push(k==='exp'?{role:'',company:'',from:'',to:'',desc:''}:{school:'',degree:'',from:'',to:'',extra:''});lists();save()}});
$('ax').onclick=()=>{D.exp.push({role:'',company:'',from:'',to:'',desc:''});lists();save()};$('ae').onclick=()=>{D.edu.push({school:'',degree:'',from:'',to:'',extra:''});lists();save()};
$('pf').onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{const s=Math.min(i.width,i.height),c=document.createElement('canvas');c.width=c.height=400;c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,400,400);D.photo=c.toDataURL('image/jpeg',.88);photoUI();save();URL.revokeObjectURL(i.src)};i.src=URL.createObjectURL(f);e.target.value=''};
$('pr').onclick=()=>{D.photo='';photoUI();save()};
function tab(p){$('vF').hidden=p;$('vP').hidden=!p;$('tabF').classList.toggle('on',!p);$('tabP').classList.toggle('on',p);if(p)show();scrollTo(0,0)}
function show(){const v=view();$('tpls').innerHTML=TPL.map((f,i)=>'<button class="tp'+(i===T?' on':'')+'" data-t="'+i+'"><div class="th"><div>'+f(v)+'</div></div></button>').join('');const w=Math.min(innerWidth-32,794),s=w/794;$('stage').style.width=w+'px';$('stage').style.height=1123*s+'px';$('wrap').style.transform='scale('+s+')';$('wrap').innerHTML=TPL[T](v)}
$('tpls').onclick=e=>{const b=e.target.closest('[data-t]');if(b){T=+b.dataset.t;save();show()}};
$('tabF').onclick=()=>tab(false);$('tabP').onclick=()=>tab(true);$('go').onclick=()=>tab(true);addEventListener('resize',()=>{if(!$('vP').hidden)show()});
const note=m=>{$('msg').textContent=m;setTimeout(()=>$('msg').textContent='',2500)};
const need=()=>{if(!D.name.trim()){note('Please enter your name first.');return false}return true};
$('sv').onclick=()=>{save();note('Saved on this device ✓')};
$('prt').onclick=()=>{if(!need())return;$('ps').innerHTML=TPL[T](D);setTimeout(()=>print(),150)};
$('pdf').onclick=async()=>{if(!need())return;note('Preparing PDF…');const h=document.createElement('div');h.style.cssText='position:fixed;left:-10000px;top:0;width:794px';h.innerHTML=TPL[T](D);document.body.appendChild(h);try{await document.fonts.ready;const c=await html2canvas(h.firstChild,{scale:2,useCORS:true,backgroundColor:'#fff'}),{jsPDF}=window.jspdf,p=new jsPDF('p','mm','a4');p.addImage(c.toDataURL('image/jpeg',.95),'JPEG',0,0,210,297);p.save((D.name.trim().replace(/\s+/g,'-')||'cv')+'-CV.pdf');note('Downloaded ✓')}catch(e){note('Could not create PDF. Try Print → Save as PDF.')}h.remove()};
form();
</script></body></html>
