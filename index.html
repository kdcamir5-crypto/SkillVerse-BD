<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillVerse BD — Student AI Hub</title>
<script src="theme.js"></script><link rel="stylesheet" href="app.css"></head>
<body>
<main class="app">
<header class="top"><div class="brand"><div class="logo">SV</div><div class="brand-name">SkillVerse <span>BD</span></div></div><button class="avatar" id="avatar" onclick="location.href='profile.html'" aria-label="Profile">👤</button></header>
<h1 class="greeting">Hello, <span id="uname">Student!</span> 👋</h1>
<p class="sub">Ready to learn something new today?</p>
<section class="cards"><button class="bigcard g-blue" data-go="ai-study.html"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></svg></span><span class="tag">AI</span><strong>Photo Solver</strong><small>Scan or upload a question and get clear Bangla &amp; English solutions.</small></button><button class="bigcard g-navy" data-go="quiz.html"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></svg></span><span class="tag">PRACTICE</span><strong>Chapter Quiz</strong><small>Generate chapter-based quizzes and track your learning.</small></button><button class="bigcard g-violet" data-go="smart-notes.html"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M9 11h6M9 15h6"/></svg></span><span class="tag">SMART</span><strong>Smart Notes</strong><small>Turn study materials into organized summaries.</small></button><button class="bigcard g-pink" data-go="tools.html"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18"/></svg></span><span class="tag">CAREER</span><strong>CV Maker</strong><small>Build a professional CV with your chosen template.</small></button></section>
<h3 class="section-head">Daily Study Challenge</h3>
<button class="challenge" data-go="daily-challenge.html"><span class="ci">🔥</span><span><strong>Keep your learning streak</strong><small>Complete today's quiz and level up</small></span><span class="arrow">›</span></button>
</main>
<script src="nav.js" data-active="home"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>location.href=el.dataset.go));
onAuthStateChanged(auth,async user=>{
 if(!user)return;
 let name=user.displayName||((user.email||'Student').split('@')[0]);
 try{const s=await getDoc(doc(db,'users',user.uid));if(s.exists()&&s.data().name&&s.data().name.trim())name=s.data().name.trim()}catch(e){}
 document.getElementById('uname').textContent=name+'!';
 document.getElementById('avatar').textContent=name.charAt(0).toUpperCase();
});
</script>
</body></html>
