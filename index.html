<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9ECEF">
<title>SkillVerse BD — Student AI Hub</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--surface:#121a2d;--surface2:#18233a;--line:#26334d;--text:#f2f5ff;--muted:#97a6c2;--purple:#8b5cf6;--blue:#4f8cff;--mint:#5eead4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#2a2057 0,transparent 38%),var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0} .app{max-width:540px;margin:auto;min-height:100dvh;padding:18px 17px calc(94px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;align-items:center;gap:10px}.logo{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#4f8cff);box-shadow:0 6px 22px #6545d455;font-weight:900;font-size:17px}.brand-name{font-size:17px;font-weight:800;letter-spacing:-.4px}.brand-name span{color:#a78bfa}.subbrand{font-size:10px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase}.avatar{width:39px;height:39px;border:1px solid #3b4965;background:#1c2941;border-radius:50%;display:grid;place-items:center;font-size:17px}
.greeting{margin:0 0 5px;font-size:25px;letter-spacing:-.8px;font-weight:800}.greeting span{color:#b49aff}.welcome-note{margin:0 0 20px;color:var(--muted);font-size:13px}
.hero{position:relative;overflow:hidden;border:1px solid #4b3d7b;border-radius:23px;padding:19px;background:linear-gradient(120deg,#24204a,#192747 70%,#18334a);margin-bottom:21px;min-height:190px}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-52px;top:-42px;background:radial-gradient(circle,#9d7aff44,transparent 70%)}.hero-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#c7b9ff;font-weight:700}.hero h2{font-size:21px;line-height:1.25;letter-spacing:-.5px;margin:9px 0 8px;max-width:265px}.hero p{margin:0;color:#c2cbe0;font-size:12px;max-width:250px}.hero-button{margin-top:15px;padding:10px 15px;border-radius:12px;background:linear-gradient(100deg,#9a70ff,#628eff);font-weight:700;font-size:12px;box-shadow:0 6px 18px #7656d633}.hero-art{position:absolute;right:18px;bottom:17px;width:104px;height:105px;display:grid;place-items:center;z-index:1}.orb{width:83px;height:83px;border-radius:50%;border:1px solid #b9a5ff66;background:radial-gradient(circle at 35% 30%,#bca7ff,#7553e9 42%,#2a2b6a 75%);box-shadow:0 0 30px #9874ff55;display:grid;place-items:center;font-size:36px}.spark{position:absolute;color:#d9d0ff;font-size:17px}.s1{top:0;right:5px}.s2{left:0;bottom:12px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 1px 12px}.section-head h3{margin:0;font-size:15px;letter-spacing:-.2px}.section-head button{background:none;color:#b6a1ff;font-size:11px;font-weight:700}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{border:1px solid var(--line);background:linear-gradient(145deg,#151f34,#11192a);border-radius:17px;padding:14px;text-align:left;min-height:110px;transition:transform .15s,border-color .15s}.tile:active{transform:scale(.98)}.tile:hover{border-color:#6e5bb4}.tile-icon{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;font-size:18px;margin-bottom:10px;background:#292449}.tile:nth-child(2) .tile-icon{background:#173448}.tile:nth-child(3) .tile-icon{background:#3b2c21}.tile:nth-child(4) .tile-icon{background:#1e3a35}.tile strong{display:block;font-size:13px;margin-bottom:3px}.tile small{font-size:11px;color:var(--muted)}
.challenge{border:1px solid var(--line);border-radius:17px;background:var(--surface);padding:15px;display:flex;align-items:center;gap:13px}.challenge-icon{width:43px;height:43px;border-radius:13px;background:#30244e;display:grid;place-items:center;font-size:20px;flex-shrink:0}.challenge-text{flex:1}.challenge-text strong{display:block;font-size:13px}.challenge-text small{color:var(--muted);font-size:11px}.arrow{color:#a78bfa;font-size:20px}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#0c1322ee;backdrop-filter:blur(18px);border-top:1px solid #27334b;padding:10px 8px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav{width:min(540px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.nav button{background:none;color:#8190ab;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 2px;font-size:10px;font-weight:600}.nav .navicon{font-size:19px;line-height:1.2}.nav button.active{color:#b7a0ff}.nav button.active .navicon{filter:drop-shadow(0 0 7px #a78bfa66)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#27334d;border:1px solid #445575;border-radius:12px;padding:11px 15px;font-size:12px;display:none;z-index:8;max-width:90%;text-align:center}
@media(min-width:540px){body{padding-bottom:0}.app{padding-top:24px}.hero{min-height:200px}}

/* Global fixed bottom navigation */
.bottom{position:fixed!important;left:0!important;right:0!important;bottom:0!important;z-index:9999!important;display:flex!important;justify-content:center!important;background:rgba(12,19,34,.96)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid #27334b!important;padding:9px 8px calc(9px + env(safe-area-inset-bottom))!important}
.bottom .nav{width:min(540px,100%)!important;display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:2px!important}
.bottom .nav button{min-width:0!important;background:none!important;border:0!important;color:#8190ab!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:4px!important;padding:5px 2px!important;font:600 10px/1.2 Inter,system-ui,sans-serif!important;white-space:nowrap!important}
.bottom .nav button .navicon{font-size:19px!important;line-height:1.2!important}
.bottom .nav button.active{color:#b7a0ff!important}
.bottom .nav button.active .navicon{filter:drop-shadow(0 0 7px #a78bfa66)}
.app{padding-bottom:calc(108px + env(safe-area-inset-bottom))!important}
@media print{.bottom{display:none!important}}

/* SkillVerse BD — LearnFlow-inspired soft study UI */
:root{color-scheme:light;--bg:#E9ECEF;--surface:#FFFFFF;--surface2:#F8FAFC;--line:#E2E8F0;--text:#1E293B;--muted:#64748B;--purple:#6366F1;--blue:#4F75FF;--mint:#64B5F6}
body{background:radial-gradient(ellipse at 85% -10%,#dbeafe 0,transparent 38%),#E9ECEF;color:#1E293B;font-family:'Plus Jakarta Sans',Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:410px;padding:18px 16px calc(112px + env(safe-area-inset-bottom))!important}
.top{margin-bottom:22px}.logo{background:linear-gradient(135deg,#4F75FF,#6366F1);box-shadow:0 6px 20px #4f75ff2b}.brand-name span{color:#6366F1}.subbrand{color:#94A3B8;letter-spacing:1.1px}
.avatar{border:1px solid #E2E8F0;background:#fff;color:#4F75FF;box-shadow:0 3px 12px #1e293b0a}
.greeting{font-size:22px;color:#1E293B;letter-spacing:-.6px}.greeting span{color:#4F75FF}.welcome-note{color:#64748B;font-size:12px;margin-bottom:18px}
.hero{border:0;border-radius:22px;padding:20px;background:linear-gradient(125deg,#4F75FF 0%,#6366F1 58%,#7C6CF2 100%);box-shadow:0 10px 26px #4f75ff24;margin-bottom:22px;min-height:184px}
.hero:after{background:radial-gradient(circle,#ffffff30,transparent 70%)}.hero-label{color:#E0E7FF}.hero h2{font-size:21px;color:#fff}.hero p{color:#EEF2FF}.hero-button{background:#fff;color:#4F75FF;box-shadow:0 5px 15px #1e293b14;border-radius:12px}.orb{border:1px solid #ffffff50;background:radial-gradient(circle at 35% 30%,#fff,#c7d2fe 42%,#6366f1 75%);box-shadow:0 0 28px #ffffff25}
.section-head{margin:21px 1px 12px}.section-head h3{font-size:15px;color:#1E293B}.section-head button{color:#4F75FF}
.quick{gap:12px}.tile{background:#fff;border:1px solid #E8EDF5;border-radius:17px;padding:14px;min-height:126px;box-shadow:0 5px 16px #1e293b08;transition:transform .15s,border-color .15s,box-shadow .15s}
.tile:hover{border-color:#C7D2FE;box-shadow:0 8px 20px #4f75ff12}.tile:active{transform:scale(.98)}
.tile-icon{width:40px;height:40px;border-radius:12px;background:#E0E7FF!important;color:#4F75FF;display:grid;place-items:center}
.tile:nth-child(2) .tile-icon{background:#FFE4E6!important}.tile:nth-child(3) .tile-icon{background:#DBEAFE!important}.tile:nth-child(4) .tile-icon{background:#EDE9FE!important}
.tile strong{font-size:13px;color:#1E293B}.tile small{color:#64748B;font-size:11px}
.challenge{border:1px solid #E8EDF5;border-radius:17px;background:#fff;padding:15px;box-shadow:0 5px 16px #1e293b08}.challenge-icon{background:#FCE7F3;color:#FF6B6B}.challenge-text strong{color:#1E293B}.challenge-text small{color:#64748B}.arrow{color:#4F75FF}
.bottom{left:50%!important;right:auto!important;bottom:10px!important;transform:translateX(-50%);width:min(410px,calc(100% - 24px))!important;background:rgba(255,255,255,.94)!important;border:1px solid #E8EDF5!important;border-radius:22px!important;box-shadow:0 8px 30px #1e293b12!important;backdrop-filter:blur(18px)!important;-webkit-backdrop-filter:blur(18px)!important;padding:8px 7px calc(8px + env(safe-area-inset-bottom))!important}
.bottom .nav{width:100%!important}.bottom .nav button{color:#94A3B8!important;font-size:10px!important}.bottom .nav button.active{color:#4F75FF!important}.bottom .nav button.active .navicon{filter:drop-shadow(0 0 6px #4f75ff30)}
.toast{background:#1E293B;border:1px solid #334155}
@media(min-width:540px){.app{padding-top:24px}.hero{min-height:190px}.bottom{width:min(410px,calc(100% - 24px))!important}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><div class="logo">SV</div><div><div class="brand-name">SkillVerse <span>BD</span></div><div class="subbrand">Your AI learning companion</div></div></div><button class="avatar" aria-label="Profile" data-page="Profile">👤</button></header>
<section aria-label="Welcome"><h1 class="greeting">Hello, <span>Student!</span> 👋</h1><p class="welcome-note">Ready to learn something new today?</p></section>
<section class="hero"><div class="hero-label">✦ AI Student Helper</div><h2>Learn smarter.<br>Achieve more.</h2><p>Get instant solutions with clear Bangla & English explanations.</p><button class="hero-button" data-page="AI Study">Solve a Question&nbsp; →</button><div class="hero-art"><span class="spark s1">✦</span><div class="orb">🧠</div><span class="spark s2">✧</span></div></section>
<section><div class="section-head"><h3>Quick Access</h3><button data-page="Tools">Explore all →</button></div><div class="quick">
<button class="tile" data-page="AI Study"><span class="tile-icon">📸</span><strong>Photo Solver</strong><small>Snap & solve questions</small></button>
<button class="tile" data-page="Quiz"><span class="tile-icon">🎯</span><strong>Chapter Quiz</strong><small>Practice & test yourself</small></button>
<button class="tile" data-page="Tools"><span class="tile-icon">📝</span><strong>Smart Notes</strong><small>Summaries made simple</small></button>
<button class="tile" data-page="Tools"><span class="tile-icon">💼</span><strong>CV Maker</strong><small>Create a pro CV</small></button>
</div></section>
<section><div class="section-head"><h3>Daily Study Challenge</h3><button data-page="Daily Challenge">View →</button></div><button class="challenge" style="width:100%;text-align:left" data-page="Daily Challenge"><span class="challenge-icon">🔥</span><span class="challenge-text"><strong>Keep your learning streak</strong><small>Complete today's quiz and level up</small></span><span class="arrow">›</span></button></section>
</main>
<nav class="bottom" aria-label="Main navigation"><div class="nav">
<button class="active" data-page="Home"><span class="navicon">⌂</span>Home</button><button data-page="AI Study"><span class="navicon">✦</span>AI Study</button><button data-page="Quiz"><span class="navicon">▤</span>Quiz</button><button data-page="Tools"><span class="navicon">▦</span>Tools</button><button data-page="Profile"><span class="navicon">♙</span>Profile</button>
</div></nav><div class="toast" id="toast" role="status"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const toast=document.getElementById('toast');let toastTimer;
function showToast(message){toast.textContent=message;toast.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.display='none',2200)}
onAuthStateChanged(auth,async user=>{
 const greeting=document.querySelector('.greeting span'),avatar=document.querySelector('.avatar');
 if(!user){greeting.textContent='Student!';avatar.textContent='👤';return}
 let name=user.displayName||((user.email||'Student').split('@')[0]);
 try{const snap=await getDoc(doc(db,'users',user.uid));if(snap.exists()){const profile=snap.data();if(profile.name&&profile.name.trim())name=profile.name.trim()}}catch(err){/* Keep the Firebase Auth name if profile read is unavailable. */}
 greeting.textContent=name+'!';
 avatar.textContent=name.charAt(0).toUpperCase();
});
document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>{const page=el.dataset.page;if(page==='AI Study'){location.href='ai-study.html';return}if(page==='Quiz'){location.href='quiz.html';return}if(page==='Daily Challenge'){location.href='daily-challenge.html';return}if(page==='Tools'){location.href='tools.html';return}if(page==='Profile'){location.href='profile.html';return}if(page==='Home'){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='Home'));return}document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));showToast(page+' section will be added in the next development step.')}))
</script>
</body></html>
