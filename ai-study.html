<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020">
<title>AI Study | SkillVerse BD</title>
<style>
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#18233a;--line:#26334d;--text:#f2f5ff;--muted:#97a6c2;--purple:#8b5cf6;--blue:#4f8cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#2a2057 0,transparent 38%),var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;min-height:100dvh}.app{max-width:540px;margin:auto;padding:18px 17px calc(35px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:23px}.back{width:39px;height:39px;border:1px solid var(--line);background:var(--panel);border-radius:13px;font-size:20px;color:var(--text)}.brand{font-weight:800;font-size:17px}.brand span{color:#a78bfa}.subtitle{color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase}.heading{font-size:25px;letter-spacing:-.7px;margin:0 0 5px;font-weight:800}.lead{color:var(--muted);margin:0 0 20px;font-size:13px}
.panel{border:1px solid var(--line);background:linear-gradient(145deg,#151f34,#11192a);border-radius:19px;padding:16px;margin-bottom:14px}.label{font-size:12px;font-weight:700;display:block;margin-bottom:10px}.upload{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;border:1px dashed #6753a7;background:#1a1c35;border-radius:15px;padding:22px 12px;text-align:center;min-height:140px}.upload .emoji{font-size:30px}.upload strong{font-size:13px}.upload small{color:var(--muted);font-size:11px}.upload input{max-width:100%;font-size:11px;color:var(--muted)}textarea,select{width:100%;color:var(--text);background:#0d1526;border:1px solid #2b3954;border-radius:12px;padding:12px;font:inherit;outline:none}textarea{resize:vertical;min-height:110px}select{height:44px}.field{margin-top:14px}.primary{width:100%;padding:13px 15px;border:0;border-radius:13px;background:linear-gradient(100deg,#9a70ff,#628eff);color:white;font-weight:800;font-size:13px;margin-top:16px;cursor:pointer}.primary:disabled{opacity:.55;cursor:wait}.notice{color:#c5b8ff;font-size:11px;line-height:1.5;margin-top:12px;min-height:16px;overflow-wrap:anywhere}.preview{display:none;max-width:100%;max-height:200px;border-radius:12px;margin:12px auto 0}.result{display:none}.result h3{margin:0 0 8px;font-size:15px}.result p{color:var(--muted);font-size:12px;margin:0}.resultbox{background:#0d1526;border-radius:12px;padding:14px;color:#dce4f7;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px;font-size:13px;line-height:1.65}
</style>
</head>
<body><main class="app">
<header class="top"><button class="back" onclick="location.href='index.html'" aria-label="Back to Home">‹</button><div><div class="brand">SkillVerse <span>BD</span></div><div class="subtitle">AI learning companion</div></div></header>
<h1 class="heading">AI Study Helper ✦</h1><p class="lead">Upload a question photo or type your question for step-by-step learning.</p>
<section class="panel"><label class="label" for="photo">Question Photo</label><label class="upload" for="photo"><span class="emoji">📸</span><strong>Choose a question image</strong><small>JPG, PNG or WEBP · Maximum 3.8 MB</small><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="preview" class="preview" alt="Selected question preview">
<div class="field"><label class="label" for="question">Or type your question</label><textarea id="question" maxlength="8000" placeholder="Write your question here… (Bangla or English)"></textarea></div>
<div class="field"><label class="label" for="language">Explanation Language</label><select id="language"><option value="Bangla">বাংলা (Bangla)</option><option value="English">English</option><option value="Both">Bangla + English</option></select></div>
<div class="field"><label class="label" for="level">Study Level</label><select id="level"><option>School</option><option>SSC</option><option>HSC</option><option>University</option><option>General</option></select></div>
<button class="primary" id="solve" type="button">✦ Solve Question</button><p class="notice" id="status" role="status" aria-live="polite">Sign in to SkillVerse BD before asking the AI tutor.</p></section>
<section class="panel result" id="result"><h3>AI Solution</h3><p>Step-by-step explanation from your AI tutor.</p><div class="resultbox" id="resulttext"></div></section>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { firebaseConfig } from './firebase-config.js';

const AI_GATEWAY = 'https://skillverse-ai-study.kdcamir5.workers.dev';
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const photo = document.getElementById('photo');
const preview = document.getElementById('preview');
const question = document.getElementById('question');
const solveButton = document.getElementById('solve');
const status = document.getElementById('status');
const result = document.getElementById('result');
const resultText = document.getElementById('resulttext');
let currentUser = null;
let previewUrl = null;

onAuthStateChanged(auth, user => {
  currentUser = user;
  status.textContent = user
    ? 'You are signed in. Upload a question photo or type a question to begin.'
    : 'Please sign in to SkillVerse BD before asking the AI tutor.';
});

photo.addEventListener('change', () => {
  const file = photo.files && photo.files[0];
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = null;
  if (!file) { preview.style.display = 'none'; preview.removeAttribute('src'); return; }
  if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
    alert('Please choose a JPG, PNG or WEBP image.');
    photo.value = '';
    preview.style.display = 'none';
    return;
  }
  if (file.size > 3.8 * 1024 * 1024) {
    alert('Image is too large. Please choose an image under 3.8 MB.');
    photo.value = '';
    preview.style.display = 'none';
    return;
  }
  previewUrl = URL.createObjectURL(file);
  preview.src = previewUrl;
  preview.style.display = 'block';
  status.textContent = 'Image selected. You can now solve the question.';
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const value = String(reader.result || '');
      const comma = value.indexOf(',');
      if (comma < 0) reject(new Error('Could not read the selected image.'));
      else resolve(value.slice(comma + 1));
    };
    reader.onerror = () => reject(new Error('Could not read the selected image.'));
    reader.readAsDataURL(file);
  });
}

solveButton.addEventListener('click', async () => {
  const file = photo.files && photo.files[0];
  const typedQuestion = question.value.trim();
  if (!file && !typedQuestion) {
    status.textContent = 'Please upload a question photo or type your question first.';
    return;
  }
  if (!currentUser) {
    status.textContent = 'Please sign in first. Opening the sign-in page…';
    setTimeout(() => { location.href = 'auth.html'; }, 700);
    return;
  }

  solveButton.disabled = true;
  solveButton.textContent = '✦ Solving your question…';
  status.textContent = 'Connecting securely to your AI tutor. Please wait…';
  result.style.display = 'none';

  try {
    const idToken = await currentUser.getIdToken();
    const body = {
      question: typedQuestion,
      language: document.getElementById('language').value,
      level: document.getElementById('level').value
    };
    if (file) {
      body.imageData = await fileToBase64(file);
      body.mimeType = file.type;
    }

    const response = await fetch(AI_GATEWAY + '/solve', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + idToken
      },
      body: JSON.stringify(body)
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) {
      const diagnostic = payload.diagnostic;
      const detail = diagnostic
        ? ' (HTTP ' + (diagnostic.httpStatus || response.status) + ', ' + (diagnostic.code || 'UNKNOWN') + ': ' + (diagnostic.message || 'No provider detail') + ')'
        : '';
      throw new Error((payload.error || 'AI could not solve this question. Please try again.') + detail);
    }
    resultText.textContent = payload.answer || 'AI returned an empty answer. Please try again.';
    result.style.display = 'block';
    status.textContent = '✓ Your solution is ready.';
    result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch (error) {
    status.textContent = error.message || 'Could not connect to the AI service. Please try again.';
  } finally {
    solveButton.disabled = false;
    solveButton.textContent = '✦ Solve Question';
  }
});
</script></body></html>
