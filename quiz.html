<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020">
<title>Chapter Quiz | SkillVerse BD</title>
<style>
:root{--bg:#0b1020;--panel:#121a2d;--line:#26334d;--text:#f2f5ff;--muted:#97a6c2;--purple:#8b5cf6;--blue:#4f8cff;--mint:#5eead4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#2a2057 0,transparent 38%),var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;min-height:100dvh}.app{max-width:540px;margin:auto;padding:18px 17px calc(35px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:23px}.back{width:39px;height:39px;border:1px solid var(--line);background:var(--panel);border-radius:13px;font-size:20px}.brand{font-weight:800;font-size:17px}.brand span{color:#a78bfa}.subtitle{color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase}.heading{font-size:25px;letter-spacing:-.7px;margin:0 0 5px;font-weight:800}.lead{color:var(--muted);margin:0 0 20px;font-size:13px}
.panel{border:1px solid var(--line);background:linear-gradient(145deg,#151f34,#11192a);border-radius:19px;padding:16px;margin-bottom:14px}.label{font-size:12px;font-weight:700;display:block;margin-bottom:9px}.field{margin-bottom:14px}select{width:100%;height:44px;color:var(--text);background:#0d1526;border:1px solid #2b3954;border-radius:12px;padding:10px;font:inherit}.primary,.secondary{padding:12px 15px;border-radius:13px;font-weight:800;font-size:13px}.primary{width:100%;background:linear-gradient(100deg,#9a70ff,#628eff)}.secondary{background:#222d45;border:1px solid #34435e}.muted{color:var(--muted);font-size:11px}.quiz{display:none}.progressline{height:6px;background:#26334d;border-radius:9px;overflow:hidden;margin:10px 0 15px}.progressfill{height:100%;width:0;background:linear-gradient(90deg,#9a70ff,#628eff);transition:width .2s}.qtext{font-size:16px;font-weight:750;line-height:1.5;margin:12px 0 16px}.options{display:grid;gap:9px}.option{background:#0d1526;border:1px solid #2b3954;border-radius:13px;padding:12px;text-align:left;font-size:13px}.option.selected{border-color:#9a70ff;background:#211b3b}.option.correct{border-color:#3cc9a9;background:#12302e}.option.wrong{border-color:#e87979;background:#321c2b}.feedback{display:none;border-radius:12px;padding:12px;margin:12px 0;font-size:12px}.feedback.good{display:block;background:#12302e;color:#8ce6d2}.feedback.bad{display:block;background:#321c2b;color:#ffb5c0}.quiz-actions{display:flex;gap:10px;margin-top:14px}.quiz-actions button{flex:1}.resultscore{font-size:36px;font-weight:900;color:#b7a0ff}.result{display:none;text-align:center}.result p{color:var(--muted);font-size:12px}
</style>
</head><body><main class="app">
<header class="top"><button class="back" onclick="location.href='index.html'" aria-label="Back to Home">‹</button><div><div class="brand">SkillVerse <span>BD</span></div><div class="subtitle">AI learning companion</div></div></header>
<h1 class="heading">Chapter Quiz 🎯</h1><p class="lead">Practice with a sample quiz. Choose your study level and subject.</p>
<section class="panel" id="setup"><div class="field"><label class="label" for="level">Study Level</label><select id="level"><option>SSC</option><option>HSC</option><option>School</option><option>University</option></select></div>
<div class="field"><label class="label" for="subject">Subject</label><select id="subject"><option value="General Science">General Science</option><option value="Mathematics">Mathematics</option><option value="English">English</option><option value="ICT">ICT</option></select></div>
<div class="field"><label class="label" for="chapter">Chapter</label><select id="chapter"><option>Basic Concepts</option><option>Number System</option><option>Grammar Basics</option><option>Introduction to ICT</option></select></div>
<p class="muted">Demo quiz has 5 practice questions. AI-generated and chapter-specific quizzes will be connected later.</p><button class="primary" id="start">Start Quiz →</button></section>
<section class="panel quiz" id="quiz"><div class="muted" id="counter">Question 1 of 5</div><div class="progressline"><div class="progressfill" id="progress"></div></div><div class="qtext" id="qtext"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="quiz-actions"><button class="secondary" id="check">Check Answer</button><button class="primary" id="next" disabled>Next →</button></div></section>
<section class="panel result" id="result"><div>Quiz Complete ✨</div><div class="resultscore" id="score"></div><p id="scoretext"></p><button class="primary" id="again">Try Again</button><button class="secondary" style="width:100%;margin-top:10px" onclick="location.href='index.html'">Back Home</button></section>
</main><script>
const questions=[
{q:'Which part of a plant mainly prepares food through photosynthesis?',a:['Root','Leaf','Stem','Flower'],correct:1,ex:'Leaves contain chlorophyll and are the main site of photosynthesis.'},
{q:'What is the value of 7 × 8?',a:['54','56','64','48'],correct:1,ex:'7 multiplied by 8 equals 56.'},
{q:'Which word is a noun?',a:['Quickly','Beautiful','Education','Run'],correct:2,ex:'Education names a concept, so it is a noun.'},
{q:'Which number is a prime number?',a:['21','27','29','33'],correct:2,ex:'29 has only two positive factors: 1 and 29.'},
{q:'What does CPU stand for?',a:['Central Processing Unit','Computer Power Utility','Control Program User','Central Print Unit'],correct:0,ex:'CPU stands for Central Processing Unit.'}
];
let index=0,score=0,chosen=null,checked=false;
const $=id=>document.getElementById(id);
function render(){const item=questions[index];chosen=null;checked=false;$('counter').textContent='Question '+(index+1)+' of '+questions.length;$('progress').style.width=((index+1)/questions.length*100)+'%';$('qtext').textContent=item.q;$('options').innerHTML='';item.a.forEach((text,i)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+text;b.onclick=()=>{if(checked)return;chosen=i;document.querySelectorAll('.option').forEach((x,j)=>x.classList.toggle('selected',j===i))};$('options').appendChild(b)});$('feedback').className='feedback';$('feedback').textContent='';$('check').disabled=false;$('next').disabled=true;$('next').textContent=index===questions.length-1?'See Results':'Next →'}
$('start').onclick=()=>{$('setup').style.display='none';$('quiz').style.display='block';index=0;score=0;render()};
$('check').onclick=()=>{if(chosen===null){alert('Choose an answer first.');return}checked=true;const item=questions[index],buttons=document.querySelectorAll('.option');buttons.forEach((b,i)=>{if(i===item.correct)b.classList.add('correct');if(i===chosen&&chosen!==item.correct)b.classList.add('wrong')});const f=$('feedback');f.className='feedback '+(chosen===item.correct?'good':'bad');f.textContent=(chosen===item.correct?'Correct! ':'Not quite. ')+item.ex;$('check').disabled=true;$('next').disabled=false;if(chosen===item.correct)score++};
$('next').onclick=()=>{if(!checked)return;if(index<questions.length-1){index++;render()}else{$('quiz').style.display='none';$('result').style.display='block';$('score').textContent=score+' / '+questions.length;$('scoretext').textContent='You answered '+score+' of '+questions.length+' questions correctly. Keep practicing!'}};
$('again').onclick=()=>{$('result').style.display='none';$('setup').style.display='block'};
</script></body></html>
